<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG PING RANYA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Arial', sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }
        .main-card {
            width: 90%;
            max-width: 380px;
            background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
            border: 2px solid #f39c12; /* ڕەنگی زەردی پۆبجی */
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 25px rgba(243, 156, 18, 0.2);
        }
        h1 { 
            color: #f39c12; 
            font-size: 26px; 
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }
        .location { color: #888; font-size: 14px; margin-bottom: 25px; }
        .ping-display {
            background: #111;
            padding: 30px;
            border-radius: 100%;
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            border: 4px double #00ff41;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .num { font-size: 55px; font-weight: bold; color: #00ff41; }
        .ms { font-size: 16px; color: #555; }
        .btn {
            background: #f39c12;
            color: #000;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>PUBG PING RANYA</h1>
        <div class="location">SERVER: RANYA - KURDISTAN</div>
        
        <div class="ping-display">
            <span class="num">20</span>
            <span class="ms">MS</span>
        </div>

        <button class="btn" onclick="boost()">ACTIVATE BOOSTER</button>
        <p id="msg" style="margin-top: 15px; color: #00ff41; font-size: 13px; display: none;">Optimization Complete! ✅</p>
    </div>

    <script>
        function boost() {
            document.getElementById('msg').style.display = "block";
            alert("پینگ لەسەر ٢٠ جێگیر کرا بۆ شاری ڕانیە 🚀");
        }
    </script>

</body>
</html>
