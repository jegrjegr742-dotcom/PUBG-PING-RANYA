<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG PING RANYA | REAL-TIME</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0a0a0a; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }
        .card {
            width: 350px;
            background: #151515;
            border: 2px solid #f39c12;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.2);
        }
        h2 { color: #f39c12; margin-bottom: 5px; font-size: 22px; }
        .location { color: #666; font-size: 12px; margin-bottom: 25px; }
        .ping-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #222;
            margin: 0 auto 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }
        #ping-value { font-size: 45px; font-weight: bold; color: #00ff41; }
        .ms-label { font-size: 14px; color: #555; }
        .status-bar { font-size: 14px; margin-top: 15px; color: #f39c12; }
        .btn {
            background: #f39c12;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>PUBG PING RANYA</h2>
        <div class="location">REAL-TIME NETWORK MONITOR</div>
        
        <div class="ping-circle" id="circle">
            <span id="ping-value">--</span>
            <span class="ms-label">MS</span>
        </div>

        <div id="status" class="status-bar">لەکاتی پشکنیندایە...</div>
        <button class="btn" onclick="checkPing()">پشکنینەوەی خێرا</button>
    </div>

    <script>
        function checkPing() {
            const pingText = document.getElementById('ping-value');
            const circle = document.getElementById('circle');
            const status = document.getElementById('status');
            
            const start = new Date().getTime();
            
            // ئەم بەشە بەڕاستی داواکاری دەنێرێت بۆ گوگل بۆ پێوانەی پینگ
            fetch("https://www.google.com/favicon.ico", { mode: 'no-cors', cache: 'no-cache' })
            .then(() => {
                const end = new Date().getTime();
                const ping = end - start;
                
                pingText.innerText = ping;
                
                // گۆڕینی ڕەنگ بەپێی پینگەکە
                if (ping < 60) {
                    pingText.style.color = "#00ff41";
                    circle.style.borderColor = "#00ff41";
                    status.innerText = "هێڵەکە زۆر باشە بۆ یاریکردن ✅";
                } else if (ping < 120) {
                    pingText.style.color = "#f1c40f";
                    circle.style.borderColor = "#f1c40f";
                    status.innerText = "هێڵەکە ئاساییە ⚠️";
                } else {
                    pingText.style.color = "#e74c3c";
                    circle.style.borderColor = "#e74c3c";
                    status.innerText = "پینگ بەرزە، ئاگاداربە! ❌";
                }
            })
            .catch(() => {
                status.innerText = "کێشە لە پەیوەندی هەیە!";
            });
        }

        // هەر ٣ چرکە جارێک بە ئۆتۆماتیکی پینگ بپشکنە
        setInterval(checkPing, 3000);
        checkPing();
    </script>

</body>
</html>
